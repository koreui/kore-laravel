# Manual de usuario
#
# Se lanza **a mano** desde la pestaña Actions, y a propósito: generar el manual
# son minutos de navegador y veinte imágenes, y no da ningún veredicto sobre el
# cambio que se está revisando. El workflow de E2E no lo incluye.
#
# Deja `docs/manual` (guías + capturas) como artifact descargable. No arma el
# PDF: eso necesita un Gotenberg levantado, y el Markdown con sus capturas ya es
# lo que hay que revisar.

name: Manual

on:
  workflow_dispatch:

concurrency:
  group: manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual:
    name: Generar el manual de usuario
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # La versión de los navegadores va atada a la de @playwright/test, que
      # está pineada en package.json.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # `.env.e2e` está commiteado y APP_ENV=e2e hace que Laravel lo cargue, así
      # que no hay nada que copiar ni ninguna clave que generar. El script
      # siembra la base y Playwright levanta y baja el servidor del manual.
      - name: Generate manual
        run: npm run manual
        env:
          CI: 'true'

      - name: Upload manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual
          path: docs/manual
          retention-days: 30

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-results
          path: tests/e2e/results-manual
          retention-days: 7
