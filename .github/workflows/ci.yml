name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Composer audit (advisories de seguridad)
        run: composer audit --no-interaction

      - name: Pint (lint)
        run: ./vendor/bin/pint --test --format=checkstyle

      - name: Larastan + PHPat + disallowed-calls (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      # Checks textuales que ninguna herramienta estática ve: #[Locked] que
      # falta, authorize() ausente, migración sin down(), válvula de escape
      # caducada, toggle fantasma, doc sin enlazar. Ver docs/architecture/rules.md.
      - name: Kore arch check
        run: php artisan kore:arch:check

      - name: Rector (refactor — dry run)
        run: ./vendor/bin/rector process --dry-run --no-progress-bar

      - name: Pest (tests)
        env:
          APP_ENV: testing
        run: ./vendor/bin/pest --parallel --compact

  # Los tests corren con withoutVite(), así que un build de assets roto pasaría
  # verde por el job de calidad. Este job es el que lo cachea.
  assets:
    name: Assets (Vite build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # resources/css/app.css importa el tema de koreUi desde vendor/, así que
      # el build necesita las dependencias de Composer aunque no ejecute PHP.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
