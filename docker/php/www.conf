; ─────────────────────────────────────────────────────────────────────────────
; Pool `www` de PHP-FPM — kore-laravel
;
; Se copia a /usr/local/etc/php-fpm.d/zzz-kore.conf (NO a www.conf). La imagen
; php:8.4-fpm-alpine incluye /usr/local/etc/php-fpm.d/*.conf en orden
; alfabético y trae ya dos archivos: `www.conf` (el pool por defecto) y
; `zz-docker.conf` (que fija `listen = 9000` para el contenedor). El nombre
; `zzz-kore.conf` carga el último, así que gana sobre los dos.
;
; Dimensionado para un VPS pequeño (2 GB de RAM). La cuenta de
; `pm.max_children` es: RAM disponible para PHP / ~40 MB por worker. Con 1 GB
; para PHP salen ~25; se dejan 20 para tener margen para MySQL y Redis.
; Ver docs/ops/deployment.md § PHP-FPM.
; ─────────────────────────────────────────────────────────────────────────────

[www]
user = www-data
group = www-data
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recicla el worker cada 500 peticiones: corta en seco cualquier fuga de memoria
; de una extensión o de un paquete.
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping
ping.response = pong

; Un request que pasa de 60 s en producción está colgado, no lento.
request_terminate_timeout = 60s

; clear_env = no: los workers heredan el entorno del contenedor (env_file).
; La config va cacheada (config:cache en el entrypoint), pero sin esto cualquier
; lectura de $_ENV en un paquete de vendor devolvería vacío.
clear_env = no

; La salida de los workers (errores de PHP, warnings) va a stderr del
; contenedor, sin decorar, para que `docker compose logs` la muestre tal cual.
catch_workers_output = yes
decorate_workers_output = no

php_admin_value[expose_php] = Off
