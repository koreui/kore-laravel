user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # ── Rate limiting ──────────────────────────────────────────────────────────
    # Detrás de un reverse proxy, $remote_addr es siempre 127.0.0.1.
    # El Nginx del host debe pasar `proxy_set_header X-Real-IP $remote_addr;`.
    map $http_x_real_ip $real_client_ip {
        ""      $binary_remote_addr;
        default $http_x_real_ip;
    }
    limit_req_zone $real_client_ip zone=auth:10m rate=5r/m;

    # ── Servidor HTTP ──────────────────────────────────────────────────────────
    # El Nginx del HOST maneja TLS y redirige HTTP→HTTPS.
    # Este contenedor sólo recibe HTTP desde localhost:8081.
    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options            "SAMEORIGIN"                          always;
        add_header X-Content-Type-Options     "nosniff"                             always;
        add_header X-XSS-Protection           "1; mode=block"                       always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
        # La CSP y HSTS las emite la APLICACIÓN: config/security.php + el middleware
        # App\Http\Middleware\SecurityHeaders, empezando en report-only
        # (CSP_REPORT_ONLY=true) para observar antes de bloquear. Si además se
        # pusiera aquí, el navegador aplicaría las dos políticas a la vez y
        # ganaría siempre la más restrictiva, que es justo lo que impide
        # observar. Para permitir un origen nuevo se edita config/security.php,
        # no este archivo. HSTS sale de la app sólo sobre HTTPS (aquí llega HTTP
        # plano desde el proxy) y SECURITY_HSTS=false la apaga de verdad. Las demás
        # cabeceras sí se quedan aquí como defensa en profundidad: cubren los
        # estáticos que Nginx sirve sin pasar por PHP.

        fastcgi_hide_header X-Powered-By;

        # ── Bloqueo de archivos y rutas sensibles ─────────────────────────────
        location ~ /\.(env|git|htaccess|htpasswd|svn|DS_Store) {
            deny all;
            return 404;
        }

        location ~ ^/(storage/logs|bootstrap|config|database|resources|routes|tests|vendor)/ {
            deny all;
            return 404;
        }

        # ── Vite assets (public/build/) ───────────────────────────────────────
        # El volumen assets_data se monta en /var/www/html/vite_assets (no puede
        # anidarse dentro del bind mount de public/ que es read-only).
        location ^~ /build/ {
            alias /var/www/html/vite_assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Livewire 4: rutas dinámicas con sufijos .js/.css ──────────────────
        # Livewire usa /livewire-{hash}/ para cache busting. Se necesita ^~ para
        # que la regex genérica de estáticos no las intercepte.
        location ^~ /livewire {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── koreUi: bundle JS servido desde la ruta del paquete ───────────────
        location ^~ /vendor/kore-ui/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── Assets estáticos: caché de larga duración ─────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~* \.(css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Rate limiting estricto en rutas de auth ───────────────────────────
        location ~ ^/(login|password|register|two-factor-challenge|magic-link)($|/) {
            limit_req        zone=auth burst=5 nodelay;
            limit_req_status 429;

            fastcgi_pass  app:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include       fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        # ── Aplicación principal ──────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ── PHP-FPM ───────────────────────────────────────────────────────────
        location ~ \.php$ {
            try_files $uri =404;

            fastcgi_pass  app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_hide_header X-Powered-By;

            fastcgi_buffer_size  128k;
            fastcgi_buffers      4 256k;
            fastcgi_read_timeout 60;
        }

        access_log /var/log/nginx/kore_access.log main;
        error_log  /var/log/nginx/kore_error.log  warn;
    }
}
